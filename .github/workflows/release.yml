name: Release

# Tag-driven release flow.
#
# To cut a release, push a semver tag prefixed with "v":
#   git tag -a v1.0.0 -m "v1.0.0"
#   git push origin v1.0.0
#
# The tag is the single source of truth for the version. The version is
# stripped of its leading "v" and passed to Gradle via -Papp.version, which
# overrides the local dev placeholder in gradle.properties. Tags containing
# a "-" (e.g. v1.0.0-beta.1) are automatically published as pre-releases.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Use bash on every runner (including windows-latest, which defaults to
# PowerShell). PowerShell mangles `-Papp.version=...` because its argument
# parser splits on the dot, sending `.version=1.0.0` to Gradle as a task
# name. Bash on Windows uses git-bash and parses identically to macOS/Linux.
defaults:
  run:
    shell: bash

jobs:
  # Release gate: never ship a tagged installer — and, through the Homebrew
  # tap, a `brew upgrade` — with bad formatting or red tests. Runs once on
  # Linux, the same checks as .github/workflows/build.yml, before any
  # installer is built.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0
        with:
          gradle-home-cache-cleanup: true

      - name: Verify formatting
        run: ./gradlew spotlessCheck

      - name: Run tests
        run: ./gradlew :composeApp:desktopTest

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            task: packageReleaseDmg
            artifact-name: container-dashboard-macos
            artifact-glob: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: ubuntu-latest
            task: packageReleaseDeb
            artifact-name: container-dashboard-linux
            artifact-glob: composeApp/build/compose/binaries/main-release/deb/*.deb
          - os: windows-latest
            task: packageReleaseMsi
            artifact-name: container-dashboard-windows
            artifact-glob: composeApp/build/compose/binaries/main-release/msi/*.msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0
        with:
          # Dependency and wrapper caches are on by default in v4+/v6+.
          # Enable cleanup so stale entries don't grow the cache unboundedly.
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        # APP_VERSION is passed via env so the tag-derived value is never
        # interpolated directly into the shell command (S5.4: prevent tag-name injection).
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :composeApp:${{ matrix.task }} -Papp.version="$APP_VERSION"

      - name: Generate SHA256 checksum
        # `sha256sum` ships with coreutils (Linux + git-bash on Windows) but
        # is missing on macOS by default. `shasum -a 256` ships with macOS
        # by default but is not guaranteed elsewhere. Pick whichever is
        # present — both produce the same `<hash>  <filename>` format.
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            HASH="sha256sum"
          else
            HASH="shasum -a 256"
          fi
          for f in ${{ matrix.artifact-glob }}; do
            $HASH "$f" > "$f.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-glob }}
            ${{ matrix.artifact-glob }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          files: artifacts/**
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Points the Homebrew cask in beytullah-gunduz/homebrew-tap at this release so
  # `brew upgrade` picks it up. Runs after the release exists, so a failure here
  # never takes the release down with it. One-time setup (deploy key, secret) is
  # in packaging/homebrew/README.md.
  homebrew:
    needs: release
    # Pre-releases stay out of the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Only reads this repository's release; writes go through the deploy key.
    permissions:
      contents: read
    # Two tags released close together must not race on the tap's branch.
    # This group only spans this repository; the tap is also written by other
    # projects' release jobs, which the push retry below absorbs.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false

    steps:
      - name: Require the tap deploy key
        env:
          HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set, so the tap still points at the previous release. See packaging/homebrew/README.md."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          sparse-checkout: packaging/homebrew

      - name: Check out the tap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          repository: beytullah-gunduz/homebrew-tap
          # A deploy key with write access to the tap only — no token that can
          # reach any other repository.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # The checksum the build job published next to the DMG.
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "ContainerDashboard-$version.dmg.sha256" --dir sha
          sha256="$(cut -d' ' -f1 "sha/ContainerDashboard-$version.dmg.sha256")"

          cask=tap/Casks/container-dashboard.rb
          # Re-tagging an older version must not roll the tap back.
          if [ -f "$cask" ]; then
            current="$(sed -nE 's/^  version "([^"]+)"$/\1/p' "$cask")"
            newest="$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)"
            if [ -n "$current" ] && [ "$newest" != "$version" ]; then
              echo "::notice::The tap already has $current, newer than $version. Left unchanged."
              exit 0
            fi
          fi

          mkdir -p tap/Casks
          packaging/homebrew/render-cask.sh "$version" "$sha256" > "$cask"
          ruby -c "$cask"

          cd tap
          if [ -z "$(git status --porcelain -- Casks)" ]; then
            echo "The tap already points at $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/container-dashboard.rb
          git commit -m "chore(container-dashboard): update to $version"
          # Another project's release may have pushed its own cask meanwhile.
          # Each project only touches its own file, so a rebase never conflicts.
          for _ in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
          done
          echo "::error::Could not push to the tap after 3 attempts."
          exit 1
